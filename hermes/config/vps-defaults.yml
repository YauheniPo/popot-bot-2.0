---
# Single source of truth for important non-secret Hermes VPS settings.
# Secrets and provider credentials remain in Ansible Vault / Hermes .env.
vps_deploy:
  identity:
    user: hermes
    user_home: /home/hermes
    hermes_home: /home/hermes/.hermes
    hermes_bin: /home/hermes/.local/bin/hermes
    workspace: /home/hermes/workspace
    backup_dir: /home/hermes/hermes-backups
  # Exact upstream Hermes Agent source installed on the VPS.
  hermes_source:
    # Base URL used to download install.sh from the exact commit below.
    raw_base_url: https://raw.githubusercontent.com/NousResearch/hermes-agent
    # Upstream branch passed to the installer; commit remains the exact pin.
    branch: main
    # Expected pyproject.toml version verified after installation.
    version: "0.21.0"
    # Human-readable upstream release label shown in deployment logs.
    release: v2026.8.31
    # Exact source revision; Ansible updates Hermes only when this differs.
    commit: 29112bef099274229cadff79cdff7bf7b99c4b77
    # Expected checksum of install.sh downloaded from that exact commit.
    installer_sha256: 85ef536d455e51ab67aa74d79272efd49fe717597dbaadfd3cca179a905f4706
  # Local directory for this repository's managed deployment files. It is not
  # part of the upstream Hermes Agent checkout.
  bundle:
    dir: /opt/hermes-bootstrap
  features:
    browser_automation: true
    development_clis: true
    google_workspace_cli: true
    force_gateway: false
    auto_enable_gateway: true
    observability: true
    tailscale: true
    host_admin: true
    lock_public_ssh: false
    vscode_server: true
  # Deliver provider keys (including OLLAMA_API_KEY and optional
  # OPENROUTER_API_KEY) from encrypted Vault.
  # hermes_secret_env owns the entire .env; retain every active secret there.
  # Ansible rejects an empty map before replacing the deployed .env.
  secret_environment:
    managed: true

# Non-secret nested Hermes config.yaml values can be managed here. Repository
# policy wins over the deprecated hermes_llm_config Vault variable. The main
# model is deliberately authoritative here, so a /model_global override is
# reset to this default on the next deploy.
vps_hermes:
  config:
    managed_overlay:
      model:
        default: kimi-k3
        provider: ollama-cloud
      # Keep Ollama authoritative, with the free OpenRouter router as an
      # explicit emergency fallback when OPENROUTER_API_KEY is supplied.
      fallback_providers:
        - provider: openrouter
          model: openrouter/free
      user_char_limit: 3000
      memory_char_limit: 4000
      # Compact long sessions after 70% of the active model context is used.
      compression:
        threshold: 0.70
      # Keep context compaction on the same pinned Ollama Cloud model so every
      # Hermes request uses Kimi K3.
      auxiliary:
        compression:
          provider: ollama-cloud
          model: kimi-k3
      # Keep scheduled jobs independent from interactive model changes.
      # A per-job provider/model pin still takes precedence.
      cron:
        model_provider: ollama-cloud
        model: kimi-k3
        model_drift_guard: true
      # Let Hermes select only providers whose credentials/capabilities are
      # available. Managed Vault keys still enable Brave and Firecrawl through
      # the capability overlay without breaking manual .env or Nous fallback.
      web:
        search_backend: auto
        extract_backend: auto
      # Skills irrelevant to this profile (headless Linux VPS, Telegram
      # gateway, QA/ops work). Disabling is by skill name from SKILL.md
      # frontmatter — renaming or moving a skill directory does NOT disable
      # it, and the bundled-skill sync restores such directories on every
      # update. This list is authoritative (list_merge=replace), so a
      # deployment always re-asserts it.
      skills:
        disabled:
          # macOS-only integrations
          - apple-notes
          - apple-reminders
          - findmy
          - imessage
          # Consumer/social integrations
          - openhue
          - xurl
          - songsee
          - gif-search
          - grilling
          - product-price-monitor
          # Office suites and SaaS this deployment does not use
          - airtable
          - box
          - notion
          - maps
          - powerpoint
          # Heavy creative tooling (architecture-diagram, excalidraw,
          # claude-design and design-md stay: useful for QA docs).
          - comfyui
          - touchdesigner-mcp
          - manim-video
          - ascii-video
          - ascii-art
          - songwriting-and-ai-music
          - p5js
          - sketch
          - pretext
          - baoyu-infographic
          - popular-web-designs
          - humanizer
          - svg-graphics
          # ML infrastructure — not this stack
          - huggingface-hub
          - evaluating-llms-harness
          - weights-and-biases
          - llama-cpp
          - serving-llms-vllm
          # Superseded in v0.21.0 by the consolidated `github` skill; the
          # old per-task copies still sit on disk from the 0.20.x catalog.
          - github-auth
          - github-code-review
          - github-issue-to-pr
          - github-issues
          - github-pr-workflow
          - github-repo-management

vps_tools:
  google_workspace_cli:
    version: "0.22.5"

vps_packages:
  grafana_channel: stable
  apt_retry_attempts: 6
  apt_retry_delay_seconds: 20

vps_network:
  ssh_port: 22
  tailscale:
    interface: tailscale0
    package_channel: stable
  firewall:
    default_incoming: deny
    default_outgoing: allow

vps_runtime:
  set:
    terminal.cwd: "${HERMES_WORKSPACE}"
    # Restarts and other dangerous terminal commands remain available to the
    # agent, but execute only after the owner explicitly approves them.
    approvals.mode: manual
    checkpoints.enabled: true
    updates.pre_update_backup: full
    updates.non_interactive_local_changes: stash
    gateway.systemd_watchdog_seconds: 120
    agent.verify_on_stop: auto
    browser.backend: "off"
    tool_loop_guardrails.hard_stop_enabled: true
    tool_loop_guardrails.hard_stop_after.exact_failure: 3
    tool_loop_guardrails.hard_stop_after.same_tool_failure: 3
    tool_loop_guardrails.hard_stop_after.idempotent_no_progress: 3
    tool_loop_guardrails.loop_caps.max_web_searches: 20
    tool_loop_guardrails.loop_caps.max_subagents: 10
    display.tool_progress: "verbose"
    display.platforms.telegram.interim_assistant_messages: false
    display.background_process_notifications: result
    # Local Hermes: keep /gw_restart and /model_global visible in the
    # Telegram menu — the default 60-command cap would hide them.
    platforms.telegram.extra.command_menu.priority_mode: prepend
    platforms.telegram.extra.command_menu.priority: [gw_restart, model_global, model, status, doctor, stop]
    # Commands above stay pinned in this exact order. Remaining commands are
    # ranked by persisted authorized Telegram command usage and the menu is
    # refreshed after every five invocations.
    platforms.telegram.extra.command_menu.usage_ranking.enabled: true
    platforms.telegram.extra.command_menu.usage_ranking.refresh_every: 5
    session_reset.mode: idle
    session_reset.idle_minutes: 2880
    # Ollama Cloud has no repository-side token budget; use the largest
    # output window accepted by the Hermes config contract.
    model.max_tokens: 32768
    # Prune stale tool-call output from context without an extra LLM call.
    # Starting value; tune based on observed context growth.
    proactive_prune_tokens: 50000
    # Bounded instead of unlimited, so a stuck run fails instead of burning
    # tokens indefinitely. Above the 20-turn default since this agent runs
    # unattended VPS/ops tasks that can legitimately need more steps.
    agent.max_turns: 200
    goals.max_turns: 50
    # Match the agent-cache TTL to how long sessions actually stay idle
    # (session_reset.idle_minutes above) so a live session isn't evicted from
    # memory and cold-started again mid-conversation. Default is 3600s (1h).
    agent.agent_cache.idle_ttl_secs: 172800
  capabilities:
    brave_search:
      set:
        web.search_backend: brave-free
    firecrawl_extract:
      set:
        web.extract_backend: firecrawl

# Managed GitHub access for terminal + bundled Hermes GitHub skills. The token
# itself belongs in Ansible Vault as GITHUB_TOKEN; this section is non-secret.
vps_github:
  enabled: true
  require_auth: true
  host: github.com
  expected_login: YauheniPo
  default_owner: YauheniPo
  access_probe_repository: YauheniPo/popot-bot-2.0
  repositories_dir: /home/hermes/workspace/repositories
  write_owners:
    - YauheniPo
  write_repositories: []
  git_identity:
    name: YauheniPo
    email: ip.popovich@mail.ru
  git_defaults:
    default_branch: main
    fetch_prune: true
    fetch_prune_tags: true
    push_auto_setup_remote: true
    pull_ff: only

# Non-secret service context published to the Hermes workspace instructions.
# Credentials are optional and belong in hermes_secret_env in encrypted Vault:
# AZURE_DEVOPS_EXT_PAT and SONAR_TOKEN.
vps_integrations:
  azure_devops:
    organization_url: https://dev.azure.com/YauheniPo
    project: popot-bot-2.0
  sonarqube:
    url: https://sonarcloud.io
    organization: yauhenipo
    project_key: YauheniPo_popot-bot-2.0

# Root-owned operations policy. Ansible/direct deploy renders these values into
# /etc/hermes-ops.conf and the managed systemd units on every deployment.
vps_ops:
  alert_target: telegram
  service_restart_sec: 5s
  # Default parameters for the local API retry helper. The script reads these
  # values from the root-owned /etc/hermes-ops.conf rendered at deployment.
  api_retry:
    endpoint: http://127.0.0.1:9119/api/execute
    model: poolside/laguna-s-2.1:free
    message: Hello
    max_attempts: 10
    wait_seconds: 30
  backup:
    required: true
    retention_days: 14
    full_day: 7 # ISO weekday: Sunday
    full_keep: 5
    deployment_keep: 10
    max_age_hours: 26
    full_max_age_hours: 192
  health:
    disk_warn_percent: 85
    inode_warn_percent: 85
    memory_available_warn_percent: 10
    load_warn_per_cpu: 2
    metrics_max_age_minutes: 5
  timers:
    backup:
      on_boot_sec: 3min
      interval: 1d
      accuracy_sec: 5min
      randomized_delay_sec: 10min
    health:
      on_boot_sec: 10min
      interval: 5min
      accuracy_sec: 30s
      randomized_delay_sec: 20s
    metrics:
      on_boot_sec: 1min
      interval: 1min
      accuracy_sec: 15s
      randomized_delay_sec: 10s
    observability_cleanup:
      on_boot_sec: 15min
      interval: 1d
      accuracy_sec: 15min
      randomized_delay_sec: 30min

vps_observability:
  local_storage:
    database_retention_days: 90
    audit_max_bytes: 5242880
    audit_rotated_files: 2
  dashboard:
    bind_address: 127.0.0.1
    port: 9119
  grafana:
    bind_address: 127.0.0.1
    port: 3000
    admin_user: hermes
  prometheus:
    bind_address: 127.0.0.1
    port: 9090
    storage_retention: 30d
    scrape_interval: 15s
    evaluation_interval: 15s
  node_exporter:
    bind_address: 127.0.0.1
    port: 9100

# Browser IDE is loopback-only and reached through an SSH tunnel.
vps_vscode:
  project_name: hermes-vscode
  image: codercom/code-server:4.133.0-noble@sha256:c8ae938c488efc7f346deb93c04c11320b803251aa181263a8482f3aeddf1b27
  bind_address: 127.0.0.1
  host_port: 3001
  tunnel_port: 8080
  timezone: UTC

vps_browser:
  agent_browser_version: "0.35.0"
  launch_args: --no-sandbox,--disable-dev-shm-usage

# Only this marked block is repository-owned; personal SOUL.md text remains
# untouched across deployments.
vps_agent_policy:
  response_language_instruction: >-
    Always think and write your reasoning/thinking trace in Russian, regardless
    of the language of the user's query. Final answers are written in the
    language of the user's latest message.

# Only these application-owned services are restarted by deployment. Network,
# SSH, Docker, and unrelated host services are intentionally excluded.
vps_services:
  gateway:
    - hermes-gateway.service
  observability:
    - hermes-node-exporter.service
    - hermes-prometheus.service
    - grafana-server.service
    - hermes-dashboard.service
  timers:
    - hermes-backup.timer
    - hermes-health.timer
    - hermes-metrics.timer
    - hermes-observability-prune.timer
