name: vscode-server
services:
  code-server:
    build: .
    # The codercom image already runs as UID/GID 1000 (= host 'hermes'), so
    # files created in the IDE are owned by hermes on the host. Do not set an
    # explicit user: the image entrypoint (fixuid) breaks under
    # no-new-privileges when overridden.
    ports:
      # Loopback only: reachable through the SSH tunnel, never from the network.
      # Host port 3001 -> container port 8080 (the image's default listen
      # port); host 3000 is taken by the loopback-only Grafana service.
      - "127.0.0.1:3001:8080"
    volumes:
      # Repositories: full read-write — edits land directly on the host.
      - ${VPS_USER_HOME:-/home/hermes}/workspace/repositories:/home/coder/workspace/repositories
      # Hermes home: full read-write per owner choice — the IDE can edit
      # configs and skills directly from the browser.
      - ${VPS_USER_HOME:-/home/hermes}/.hermes:/home/coder/hermes-home:rw
      # Reuse the host Git identity (user name/email, defaults).
      - ${VPS_USER_HOME:-/home/hermes}/.gitconfig:/home/coder/.gitconfig:ro
      # GitHub CLI auth state so push/pull works inside the container without
      # copying any token value into the image or compose file. Mounted away
      # from ~/.config on purpose: Docker would otherwise create the missing
      # parent ~/.config as root-owned, breaking code-server's own config dir.
      - ${VPS_USER_HOME:-/home/hermes}/.config/gh:/home/coder/gh-config:rw
      - ./code-server-config.json:/etc/code-server/config.json:ro
    # Note: the image entrypoint overrides bind-addr with its own
    # `--bind-addr 0.0.0.0:8080` default; config.json is mounted for
    # documentation/parity but the effective listen port is 8080.
    env_file:
      - /etc/code-server.env
    environment:
      # Point the credential helper baked into the host ~/.gitconfig at the
      # container's gh path (the host wrapper path does not exist here).
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=credential.https://github.com.helper
      - GIT_CONFIG_VALUE_0=!/usr/bin/gh auth git-credential
      # gh auth state lives on the separate mount (see volumes).
      - GH_CONFIG_DIR=/home/coder/gh-config
      - TZ=UTC
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true