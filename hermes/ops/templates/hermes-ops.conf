# Root-owned configuration for Hermes VPS monitoring.
HERMES_ALERT_TARGET=telegram
HERMES_GATEWAY_SERVICE=hermes-gateway.service
HERMES_DISK_PATH=@HERMES_HOME@
HERMES_DISK_WARN_PERCENT=85
HERMES_INODE_WARN_PERCENT=85
HERMES_MEMORY_AVAILABLE_WARN_PERCENT=10
HERMES_LOAD_WARN_PER_CPU=2
HERMES_BACKUP_REQUIRED=true
HERMES_BACKUP_DIR=@USER_HOME@/hermes-backups
HERMES_BACKUP_MAX_AGE_HOURS=26
HERMES_BACKUP_RETENTION_DAYS=14
HERMES_FULL_BACKUP_DAY=7
HERMES_FULL_BACKUP_MAX_AGE_HOURS=192
HERMES_FULL_BACKUP_RETENTION_DAYS=35
HERMES_METRICS_FILE=@HERMES_HOME@/ops/metrics/hermes.prom
HERMES_METRICS_MAX_AGE_MINUTES=5
