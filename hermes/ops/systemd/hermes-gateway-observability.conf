[Service]
# /gw_restart drains active work then exits with code 75. Mark the process as
# service-supervised even when a launcher clears INVOCATION_ID, and make that
# one planned exit code restart the gateway without granting it generic sudo.
Environment=HERMES_GATEWAY_EXTERNAL_SUPERVISOR=1
RestartForceExitStatus=75
Environment=HERMES_PROMETHEUS_URL=http://@PROMETHEUS_BIND_ADDRESS@:@PROMETHEUS_PORT@
Environment=HERMES_OBSERVABILITY_AUDIT_MAX_BYTES=@OBSERVABILITY_AUDIT_MAX_BYTES@
Environment=HERMES_OBSERVABILITY_AUDIT_ROTATED_FILES=@OBSERVABILITY_AUDIT_ROTATED_FILES@
