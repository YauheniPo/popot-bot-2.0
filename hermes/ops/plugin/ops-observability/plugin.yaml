name: ops-observability
version: 1.1.0
description: Privacy-aware audit log, model/tool metrics, /ops, and a read-only metrics tool
provides_tools:
  - ops_metrics
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - pre_command
