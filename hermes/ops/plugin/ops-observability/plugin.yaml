name: ops-observability
version: 1.2.0
description: Privacy-aware audit log and model/tool metrics exported only to Prometheus and Grafana
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_start
  - on_session_end
  - pre_approval_request
  - post_approval_response
  - pre_command
