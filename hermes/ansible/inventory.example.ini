# Template only. Copy to `ansible/inventory.ini`, then replace the values there.
# `inventory.ini` is ignored by Git and is the file passed to Ansible.
[hermes_vps]
# Replace with the current public IP for the first run. After Tailscale is
# connected, replace ansible_host with the 100.x Tailscale IP or MagicDNS name.
# A private SSH key stays on this controller; only its public key belongs on the
# VPS. If needed, add ansible_ssh_private_key_file=/local/protected/key/path.
my-hermes ansible_host=203.0.113.10 ansible_user=root
