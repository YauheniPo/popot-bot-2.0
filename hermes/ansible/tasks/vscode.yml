---
# code-server (VS Code in the browser) runs in Docker and opens the same
# repositories directory Hermes uses. Enabled by default; set
# vps_deploy.features.vscode_server to false to skip installation.

- name: Validate the code-server password from Vault
  ansible.builtin.assert:
    that:
      - hermes_code_server_password is string
      # Passwords may use any characters. The env template JSON-escapes the
      # value before Docker Compose reads it; only an empty password is invalid.
      - hermes_code_server_password | length > 0
    fail_msg: >-
      Set a non-empty code-server password in encrypted vault.yml. Any
      characters are allowed.
  no_log: true

- name: Install Docker Compose v2 plugin
  ansible.builtin.apt:
    name: docker-compose-v2
    state: present
    update_cache: true

- name: Read the Hermes host UID
  ansible.builtin.command:
    argv: [id, -u, "{{ hermes_user }}"]
  register: hermes_vscode_uid
  changed_when: false

- name: Read the Hermes host GID
  ansible.builtin.command:
    argv: [id, -g, "{{ hermes_user }}"]
  register: hermes_vscode_gid
  changed_when: false

- name: Create the shared code-server repositories directory
  ansible.builtin.file:
    path: "{{ hermes_github_repositories_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "0750"

- name: Ensure the code-server Git configuration mount is a file
  ansible.builtin.file:
    path: "{{ hermes_user_home }}/.gitconfig"
    state: touch
    owner: "{{ hermes_user }}"
    group: "{{ hermes_user }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve

- name: Create the code-server configuration directory
  ansible.builtin.file:
    path: /etc/code-server
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Materialize the code-server password from Vault
  ansible.builtin.template:
    src: templates/code-server.env.j2
    dest: /etc/code-server.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Detect the legacy code-server container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - --format
      - "{{ '{{' }}.Id{{ '}}' }}"
      - vscode-server-code-server-1
  register: hermes_legacy_vscode_container
  changed_when: false
  failed_when: false

- name: Stop the legacy code-server container without deleting its data
  ansible.builtin.command:
    argv:
      - docker
      - container
      - stop
      - vscode-server-code-server-1
  when: hermes_legacy_vscode_container.rc == 0

- name: Preserve the legacy code-server container for manual data migration
  ansible.builtin.command:
    argv:
      - docker
      - container
      - rename
      - vscode-server-code-server-1
      - "vscode-server-code-server-1-legacy-{{ hermes_legacy_vscode_container.stdout[:12] }}"
  when: hermes_legacy_vscode_container.rc == 0

- name: Start the managed code-server container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ vps_vscode.project_name }}"
      - --env-file
      - /etc/code-server.env
      - up
      - -d
      - --build
    chdir: "{{ hermes_bundle_dir }}/vscode-server"
  environment:
    VPS_USER_HOME: "{{ hermes_user_home }}"
    HERMES_UID: "{{ hermes_vscode_uid.stdout }}"
    HERMES_GID: "{{ hermes_vscode_gid.stdout }}"
  changed_when: true

- name: Verify the code-server container is running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Running{{ '}}' }}"
      - "{{ vps_vscode.project_name }}-code-server-1"
  register: hermes_vscode_state
  changed_when: false
  failed_when: hermes_vscode_state.stdout != "true"

- name: Verify the managed Git author name inside code-server
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ vps_vscode.project_name }}-code-server-1"
      - git
      - config
      - --global
      - --get
      - user.name
  register: hermes_vscode_git_name
  changed_when: false
  failed_when: hermes_vscode_git_name.stdout != hermes_git_identity.name
  when: hermes_github_enabled | bool

- name: Verify the managed Git author email inside code-server
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ vps_vscode.project_name }}-code-server-1"
      - git
      - config
      - --global
      - --get
      - user.email
  register: hermes_vscode_git_email
  changed_when: false
  failed_when: hermes_vscode_git_email.stdout != hermes_git_identity.email
  when: hermes_github_enabled | bool

- name: Verify the managed GitHub account inside code-server
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ vps_vscode.project_name }}-code-server-1"
      - gh
      - api
      - user
      - --jq
      - .login
  register: hermes_vscode_github_user
  changed_when: false
  failed_when: hermes_vscode_github_user.stdout != hermes_github_expected_login
  no_log: true
  when:
    - hermes_github_enabled | bool
    - hermes_github_token_configured | default(false) | bool

- name: Report code-server access instructions
  ansible.builtin.debug:
    msg: >-
      code-server is up on VPS port {{ vps_vscode.host_port }}. Connect with
      ssh -L {{ vps_vscode.tunnel_port }}:localhost:{{ vps_vscode.host_port }}
      {{ hermes_user }}@<VPS_IP> and open
      http://localhost:{{ vps_vscode.tunnel_port }} (password from encrypted vault.yml).
