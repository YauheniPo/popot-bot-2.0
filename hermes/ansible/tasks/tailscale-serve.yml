---
- name: Validate private Tailscale Serve endpoints
  ansible.builtin.assert:
    that:
      - vps_tailscale.serve.enabled | bool
      - item.name is match('^[a-z][a-z0-9-]+$')
      - item.protocol in ['http', 'https']
      - item.port | int >= 1
      - item.port | int <= 65535
      # item.protocol controls the Tailscale-facing endpoint. The loopback
      # upstream is always plain HTTP, because Tailscale terminates TLS.
      - item.target is match('^' ~ 'http' ~ '://127\\.0\\.0\\.1:[1-9][0-9]{0,4}$')
    fail_msg: Invalid private Tailscale Serve endpoint.
  loop: "{{ vps_tailscale.serve.services }}"
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool

- name: Check that Tailscale is connected before publishing services
  ansible.builtin.command:
    argv: [tailscale, ip, "-4"]
  register: tailscale_serve_connection
  changed_when: false
  failed_when: false
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool

- name: Report that Serve publishing is skipped without a Tailscale address
  # A host that is not yet on the tailnet (interactive login pending, or no
  # auth key at deploy time) must not fail the deployment: joining the tailnet
  # is a separate, explicit step. Make the skip visible instead of silent.
  ansible.builtin.debug:
    msg: >-
      Tailscale Serve endpoints are not published: this host has no Tailscale
      address yet. Run 'tailscale up --ssh' and re-run the playbook.
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc | default(1) != 0

- name: Inspect the live Tailscale Serve configuration and node identity
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [tailscale, serve, status, --json]
    - [tailscale, status, --json]
  register: hermes_serve_live
  changed_when: false
  timeout: 30
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0

- name: Compare the complete private Serve configuration before publishing
  ansible.builtin.set_fact:
    hermes_serve_needs_update: >-
      {{ not ((hermes_serve_live.results[0].stdout | from_json) | hermes_serve_matches(
        (hermes_serve_live.results[1].stdout | from_json).Self.DNSName,
        vps_tailscale.serve.services +
        ([{'protocol': 'https', 'port': vps_workspace_ui.port,
           'target': 'http://127.0.0.1:' ~ vps_workspace_ui.port}]
         if (vps_deploy.features.workspace_ui | default(false) | bool) else [])
      )) }}
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0

- name: Reset changed managed Tailscale Serve configuration before publishing endpoints
  ansible.builtin.command:
    argv: [tailscale, serve, reset]
  changed_when: true
  timeout: 30
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0
    - hermes_serve_needs_update | bool

- name: Publish the companion Workspace privately over HTTPS
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - "--https={{ vps_workspace_ui.port }}"
      - "http://127.0.0.1:{{ vps_workspace_ui.port }}"
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0
    - vps_deploy.features.workspace_ui | default(false) | bool
    - hermes_serve_needs_update | bool
  changed_when: true
  timeout: 30

- name: Publish local web services privately through Tailscale Serve
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - --bg
      - "--{{ item.protocol }}={{ item.port }}"
      - "{{ item.target }}"
  loop: "{{ vps_tailscale.serve.services }}"
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0
    - hermes_serve_needs_update | bool
  changed_when: true
  timeout: 30

- name: Read the published Tailscale Serve configuration after changes
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: hermes_serve_published
  changed_when: false
  timeout: 30
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0
    - hermes_serve_needs_update | bool

- name: Verify the complete published private Serve configuration
  ansible.builtin.assert:
    that:
      - >-
        (hermes_serve_published.stdout | from_json) | hermes_serve_matches(
          (hermes_serve_live.results[1].stdout | from_json).Self.DNSName,
          vps_tailscale.serve.services +
          ([{'protocol': 'https', 'port': vps_workspace_ui.port,
             'target': 'http://127.0.0.1:' ~ vps_workspace_ui.port}]
           if (vps_deploy.features.workspace_ui | default(false) | bool) else [])
        )
    fail_msg: Tailscale Serve configuration does not match the required private endpoints.
  when:
    - hermes_enable_tailscale | bool
    - vps_tailscale.serve.enabled | bool
    - tailscale_serve_connection.rc == 0
    - hermes_serve_needs_update | bool
