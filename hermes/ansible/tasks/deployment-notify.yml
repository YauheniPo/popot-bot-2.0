---
# Deployment notifications are deliberately best-effort: Telegram outages must
# never hide the original Ansible result.
- name: Send Hermes deployment status to Telegram
  ansible.builtin.command:
    argv:
      - python3
      - "{{ hermes_bundle_dir }}/runtime/deployment-notify.py"
      - --timeout
      - "{{ vps_deploy.notifications.timeout_seconds | string }}"
      - --workers
      - "{{ vps_deploy.notifications.max_parallel | string }}"
    stdin: >-
      {{ {'token': hermes_secret_env.TELEGRAM_BOT_TOKEN,
          'chat_ids': (hermes_secret_env.TELEGRAM_ALLOWED_USERS | string).split(','),
          'text': hermes_deployment_notification} | to_json }}
  when:
    - hermes_manage_secret_env | bool
    - hermes_secret_env is mapping
    - (hermes_secret_env.TELEGRAM_BOT_TOKEN | default('', true) | string | length) > 0
    - (hermes_secret_env.TELEGRAM_ALLOWED_USERS | default('', true) | string | length) > 0
  changed_when: false
  failed_when: false
  no_log: true
