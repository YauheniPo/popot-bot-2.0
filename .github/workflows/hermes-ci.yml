name: Hermes infrastructure CI

on:
  pull_request:
    paths:
      - "hermes/**"
      - ".github/workflows/hermes-ci.yml"
      - ".github/workflows/pr-ai-review.yml"
      - ".github/scripts/openrouter_model_preflight.py"
      - ".github/scripts/openrouter_pr_review.py"
      - ".github/scripts/pr_review_context.py"
      - ".github/scripts/test_openrouter_model_preflight.py"
      - ".github/scripts/test_openrouter_pr_review.py"
      - ".github/scripts/test_pr_review_context.py"
      - ".github/REVIEWER.md"
  push:
    paths:
      - "hermes/**"
      - ".github/workflows/hermes-ci.yml"
      - ".github/workflows/pr-ai-review.yml"
      - ".github/scripts/openrouter_model_preflight.py"
      - ".github/scripts/openrouter_pr_review.py"
      - ".github/scripts/pr_review_context.py"
      - ".github/scripts/test_openrouter_model_preflight.py"
      - ".github/scripts/test_openrouter_pr_review.py"
      - ".github/scripts/test_pr_review_context.py"
      - ".github/REVIEWER.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hermes/requirements-dev.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --requirement hermes/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes ripgrep shellcheck

      - name: Run Hermes checks
        run: bash hermes/check.sh --require-tools
