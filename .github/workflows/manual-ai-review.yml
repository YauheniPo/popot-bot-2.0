name: Manual AI branch review

# The request id is part of the run name on purpose: a workflow_dispatch API
# call returns 204 with no run id, so an external caller can only find its own
# run by matching this string in the run list.
run-name: >-
  ${{ startsWith(inputs.request_id, 'ado-') && 'Azure DevOps' || 'GitHub' }}
  · ${{ inputs.target_ref }} → ${{ inputs.base_ref }} · ${{ inputs.scope }}${{ inputs.request_id && format(' · {0}', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to review
        required: true
        default: main
        type: string
      base_ref:
        description: Comparison base (ignored by full_branch)
        required: true
        default: main
        type: string
      scope:
        description: Select how the comparison base is calculated
        required: true
        default: branch_diff
        type: choice
        options:
          - branch_diff
          - last_commit
          - commit_range
          - full_branch
      model:
        description: Model for the direct reviewer
        required: true
        default: moonshotai/kimi-k3
        type: string
      provider:
        description: Provider for the direct reviewer
        required: true
        default: nvidia
        type: choice
        options:
          - ollama-cloud
          - openrouter
          - nvidia
          - nous
      publish:
        description: Where review findings should be published
        required: true
        default: auto
        type: choice
        options:
          - auto
          - existing_pr
          - check_annotations
          - draft_pr
      request_id:
        description: Optional external request id, normally supplied by Azure DevOps
        required: false
        default: ""
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: manual-ai-review-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  review:
    # A workflow_dispatch can be requested through the UI or an external API.
    # Only the repository owner may release the trusted reviewer secrets.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    # 15 minutes for two model probes + 85 for review + five for setup/publication.
    timeout-minutes: 105

    steps:
      - name: Validate manual review inputs
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          BASE_REF: ${{ inputs.base_ref }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail

          case "${PROVIDER}" in
            ollama-cloud|openrouter|nvidia|nous) ;;
            *)
              echo "::error::provider must be ollama-cloud, openrouter, nvidia, or nous."
              exit 1
              ;;
          esac

          validate_ref() {
            local value="$1"
            local label="$2"
            if [[ ! "${value}" =~ ^[A-Za-z0-9._/-]{1,200}$ ]] ||
               [[ "${value}" == -* ]] ||
               [[ "${value}" == *..* ]] ||
               [[ "${value}" == *'@{'* ]] ||
               [[ "${value}" == */ ]]; then
              echo "::error::${label} is not a safe Git ref, tag, or commit value."
              exit 1
            fi
          }

          validate_ref "${TARGET_REF}" target_ref
          validate_ref "${BASE_REF}" base_ref

      # Keep executable review tooling on the trusted default branch. The
      # selected target is checked out separately and treated only as data.
      - name: Check out trusted reviewer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: reviewer
          persist-credentials: false
          ref: main

      - name: Check out the selected review target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: target
          persist-credentials: false
          ref: ${{ inputs.target_ref }}

      - name: Resolve the exact comparison and publication target
        id: context
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ inputs.publish }}
          REVIEW_SCOPE: ${{ inputs.scope }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          head_sha="$(git -C target rev-parse 'HEAD^{commit}')"
          if [[ "${REVIEW_SCOPE}" == "full_branch" ]]; then
            # Compare the current snapshot with an empty tree so every tracked
            # file is represented as added content with valid RIGHT-side lines.
            base_sha="$(
              git -C target hash-object -t tree -w --stdin </dev/null
            )"
          else
            if requested_base_sha="$(
              git -C target rev-parse --verify "${BASE_REF}^{commit}" 2>/dev/null
            )"; then
              :
            elif requested_base_sha="$(
              git -C target rev-parse --verify \
                "refs/remotes/origin/${BASE_REF}^{commit}" 2>/dev/null
            )"; then
              :
            elif requested_base_sha="$(
              git -C target rev-parse --verify \
                "refs/tags/${BASE_REF}^{commit}" 2>/dev/null
            )"; then
              :
            else
              echo "::error::base_ref does not resolve to a fetched commit."
              exit 1
            fi

            case "${REVIEW_SCOPE}" in
              branch_diff)
                base_sha="$(git -C target merge-base "${requested_base_sha}" "${head_sha}")"
                ;;
              last_commit)
                base_sha="$(git -C target rev-parse "${head_sha}^")"
                ;;
              commit_range)
                base_sha="${requested_base_sha}"
                ;;
              *)
                echo "::error::Unsupported review scope."
                exit 1
                ;;
            esac
          fi

          if [[ "${base_sha}" == "${head_sha}" ]]; then
            echo "::error::The selected scope has no changes to review."
            exit 1
          fi

          associated_pulls="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/pulls?per_page=100"
          )"
          pr_number="$(
            jq -r \
              --arg head "${head_sha}" \
              --arg base "${BASE_REF}" \
              '[.[] | select(.state == "open" and .head.sha == $head)] |
               ((map(select(.base.ref == $base)) + .)[0].number // empty)' \
              <<<"${associated_pulls}"
          )"

          if [[ "${REVIEW_SCOPE}" == "full_branch" ]]; then
            if [[ "${PUBLISH_MODE}" == "existing_pr" ||
                  "${PUBLISH_MODE}" == "draft_pr" ]]; then
              echo "::error::full_branch supports auto or check_annotations publication only."
              exit 1
            fi
          fi

          case "${PUBLISH_MODE}" in
            auto)
              ;;
            check_annotations)
              pr_number=""
              ;;
            existing_pr)
              if [[ -z "${pr_number}" ]]; then
                echo "::error::No open pull request exists for the selected target commit."
                exit 1
              fi
              ;;
            draft_pr)
              if [[ -z "${pr_number}" ]]; then
                if [[ "${TARGET_REF}" == "${BASE_REF}" ]]; then
                  echo "::error::A draft pull request requires different target and base branches."
                  exit 1
                fi
                pr_number="$(
                  gh api \
                    --method POST \
                    "repos/${GITHUB_REPOSITORY}/pulls" \
                    -f title="Manual AI review: ${TARGET_REF}" \
                    -f head="${TARGET_REF}" \
                    -f base="${BASE_REF}" \
                    -F draft=true \
                    --jq '.number'
                )"
              fi
              ;;
            *)
              echo "::error::Unsupported publication mode."
              exit 1
              ;;
          esac

          if [[ "${REVIEW_SCOPE}" == "full_branch" ]]; then
            # Unchanged files cannot be attached to PR diff threads. A Check
            # Run can annotate any current file in the reviewed commit.
            pr_number=""
          fi

          printf 'base_sha=%s\n' "${base_sha}" >>"${GITHUB_OUTPUT}"
          printf 'head_sha=%s\n' "${head_sha}" >>"${GITHUB_OUTPUT}"
          printf 'pr_number=%s\n' "${pr_number}" >>"${GITHUB_OUTPUT}"
          if [[ -n "${pr_number}" ]]; then
            echo 'publish_target=pull_request' >>"${GITHUB_OUTPUT}"
            echo "Review findings will be published to pull request #${pr_number}."
          else
            echo 'publish_target=check_run' >>"${GITHUB_OUTPUT}"
            echo "Review findings will be published as a Check Run on ${head_sha}."
          fi

      - name: Validate selected review model
        shell: bash
        env:
          REQUESTED_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [[ -z "${REQUESTED_MODEL}" || "${REQUESTED_MODEL}" == *$'\n'* ]]; then
            echo "::error::A non-empty single-line review model is required."
            exit 1
          fi

      - name: Verify direct API JSON review
        id: models
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          DIRECT_REVIEW_PROVIDER: ${{ inputs.provider || vars.DIRECT_REVIEW_PROVIDER || 'nvidia' }}
          DIRECT_REVIEW_MODEL: ${{ inputs.model }}
          DIRECT_REVIEW_FALLBACK_MODEL: ${{ vars.DIRECT_REVIEW_FALLBACK_MODEL || '' }}
        run: python3 reviewer/.github/scripts/ai_review_preflight.py --probe json

      - name: Review selected revision and publish findings
        id: review
        working-directory: target
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          CHECK_RUN_NAME: ${{ startsWith(inputs.request_id, 'ado-') && 'Azure DevOps · Manual AI code review' || 'Manual AI code review' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          DIRECT_REVIEW_PROVIDER: ${{ inputs.provider || vars.DIRECT_REVIEW_PROVIDER || 'nvidia' }}
          DIRECT_REVIEW_MODEL: ${{ steps.models.outputs.selected_model }}
          # Internal preflight metadata; this is not a repository variable.
          DIRECT_REVIEW_PRIMARY_MODEL: ${{ steps.models.outputs.primary_model }}
          DIRECT_REVIEW_FALLBACK_MODEL: ${{ steps.models.outputs.secondary_model }}
          OLLAMA_MAX_REVIEW_CHUNKS: ${{ vars.MANUAL_REVIEW_MAX_CHUNKS || '100' }}
          # This job allows 105 minutes and up to 100 chunks. Without an explicit
          # budget the script would stop after the 40-minute default meant for
          # the automatic PR review and fail a large manual or Azure DevOps run.
          OLLAMA_REVIEW_BUDGET_SECONDS: ${{ vars.MANUAL_REVIEW_BUDGET_SECONDS || '5100' }}
          # The response mode is selected by preflight for this run.
          DIRECT_REVIEW_MODEL_MODE: ${{ steps.models.outputs.selected_mode }}
          OLLAMA_REVIEW_RPM: ${{ vars.OLLAMA_REVIEW_RPM || '60' }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REQUIRE_COMPLETE_REVIEW: ${{ inputs.scope == 'full_branch' && 'true' || 'false' }}
          REQUIRE_REVIEW_RESULT: "true"
          REVIEW_INCLUDE_REVIEWER_FILES: ${{ inputs.scope == 'full_branch' && 'true' || 'false' }}
          REVIEW_ORIGIN: ${{ startsWith(inputs.request_id, 'ado-') && 'azure-devops' || 'github-actions' }}
          REVIEW_REQUEST_ID: ${{ inputs.request_id }}
        run: python3 ../reviewer/.github/scripts/ai_pr_review.py

      - name: Summarize manual review
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          CHECK_RUN_URL: ${{ steps.review.outputs.check_run_url }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          MODEL: ${{ steps.models.outputs.selected_model }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PUBLISH_TARGET: ${{ steps.context.outputs.publish_target }}
          # GITHUB_STEP_SUMMARY is a distinct file per step, so a later step
          # cannot re-read what this step wrote there. Write the same text to
          # a fixed path too, for "Package the review report" to pick up.
          REPORT_DIR: ${{ github.workspace }}/review-report
          REVIEW_SOURCE: ${{ startsWith(inputs.request_id, 'ado-') && 'Azure DevOps' || 'GitHub' }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          {
            echo '## Manual AI code review'
            echo
            echo "- Target: \`${TARGET_REF}\`"
            echo "- Range: \`${BASE_SHA}..${HEAD_SHA}\`"
            echo "- Requested model: \`${MODEL}\` (actual successful models and retries are listed in the published review)"
            echo "- Source: \`${REVIEW_SOURCE}\`"
            echo "- Publication: \`${PUBLISH_TARGET}\`"
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- Pull request: #${PR_NUMBER}"
            fi
            if [[ -n "${CHECK_RUN_URL}" ]]; then
              # GitHub can file this check run under an unrelated check suite
              # for the same commit SHA, so link it directly here instead of
              # sending people to hunt through the Checks sidebar.
              echo "- Findings: [Open findings](${CHECK_RUN_URL})"
            fi
          } | tee -a "${GITHUB_STEP_SUMMARY}" "${REPORT_DIR}/summary.md" >/dev/null

      # A job step summary has no REST API, so an external caller cannot read
      # it back. Republish the same text plus the links as an artifact, which
      # is the only machine-readable channel out of a workflow run.
      - name: Package the review report for the caller
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          CHECK_RUN_URL: ${{ steps.review.outputs.check_run_url }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          MODEL: ${{ steps.models.outputs.selected_model }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PUBLISH_TARGET: ${{ steps.context.outputs.publish_target }}
          REPORT_DIR: ${{ github.workspace }}/review-report
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          jq -n \
            --arg request_id "${REQUEST_ID}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg job_status "${JOB_STATUS}" \
            --arg target_ref "${TARGET_REF}" \
            --arg base_sha "${BASE_SHA}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg model "${MODEL}" \
            --arg publish_target "${PUBLISH_TARGET}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg check_run_url "${CHECK_RUN_URL}" \
            '$ARGS.named' >"${REPORT_DIR}/report.json"

      - name: Upload the review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-report
          path: ${{ github.workspace }}/review-report
          if-no-files-found: error
          retention-days: 7
