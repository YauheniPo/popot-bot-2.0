name: SonarQube Cloud Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Allow the scanner up to five minutes to await the server-side gate.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python for Hermes coverage
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hermes/requirements-dev.txt

      - name: Run Hermes tests with coverage
        run: |
          python -m pip install --requirement hermes/requirements-dev.txt coverage==7.16.0
          mapfile -t hermes_tests < <(find hermes -type f -name 'test_*.py' | sort)
          coverage run --source=hermes -m unittest "${hermes_tests[@]}"
          coverage xml -o hermes-coverage.xml

      - name: Run review-script tests with coverage
        run: |
          coverage run --source=.github/scripts -m unittest discover \
            -s .github/scripts -p 'test_*.py'
          coverage xml -o github-scripts-coverage.xml

      - name: Set up Python for telegram-user-info-bot coverage
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram-user-info-bot/requirements.txt

      - name: Run telegram-user-info-bot tests with coverage
        working-directory: telegram-user-info-bot
        run: |
          python -m pip install --requirement requirements.txt coverage==7.16.0
          coverage run --source=. -m unittest discover -s tests -v
          coverage xml -o coverage.xml

      - name: Run Workspace runtime tests with JavaScript coverage
        # The managed Workspace adapters are JavaScript; Sonar counts them as
        # product code (see sonar.javascript.lcov.reportPaths). They need the
        # pinned upstream checkout plus its type tooling, and they self-skip
        # without WORKSPACE_UPSTREAM_DIR, so fetch it explicitly here rather
        # than trusting this workflow to see an installed copy.
        env:
          WORKSPACE_REVISION: c631425d8baa933f8c61d8447040f4ec8b5f571c
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/workspace-upstream"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/outsourc-e/hermes-workspace.git "$upstream"
          git -C "$upstream" fetch --quiet --depth 1 origin "$WORKSPACE_REVISION"
          git -C "$upstream" checkout --quiet --detach FETCH_HEAD
          # The adapter tests transpile upstream TypeScript with the version the
          # pinned checkout expects; install it in place of a full pnpm install.
          npm install --prefix "$upstream" --no-save --no-audit --no-fund typescript@5
          mapfile -t runtime_tests < <(find hermes/runtime -maxdepth 1 -name 'test-*.mjs' | sort)
          WORKSPACE_UPSTREAM_DIR="$upstream" node --test \
            --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=hermes-runtime.lcov \
            "${runtime_tests[@]}"

      - name: SonarQube Cloud Scan
        # GitHub does not expose repository secrets to Dependabot PRs, so the
        # Sonar token is unavailable for Dependabot and fork PRs. Keep Sonar
        # strict for pushes and same-repository PRs without false failures.
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
