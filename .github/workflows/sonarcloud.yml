name: SonarQube Cloud Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      reports_artifact_id: ${{ steps.save-reports.outputs.artifact-id }}
      coverage_ready: ${{ steps.workspace-tests.outcome == 'success' }}
    # Allow the scanner up to five minutes to await the server-side gate.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python for Hermes coverage
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hermes/requirements-dev.txt

      - name: Run Hermes tests with coverage
        run: |
          python -m pip install --requirement hermes/requirements-dev.txt coverage==7.17.1
          for attempt in 1 2 3; do
            if ansible-galaxy collection install --requirements-file hermes/ansible/requirements.yml; then
              installed=1
              break
            fi
            echo "ansible-galaxy attempt ${attempt} failed; retrying..." >&2
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          if [ -z "${installed:-}" ]; then
            echo "ansible-galaxy failed after 3 attempts" >&2
            exit 1
          fi
          mapfile -t hermes_tests < <(find hermes -type f -name 'test_*.py' | sort)
          coverage run --source=hermes --omit='**/test_*.py' -m pytest -q --junitxml=reports/hermes.junit.xml "${hermes_tests[@]}"
          coverage report --fail-under=80
          coverage xml -o hermes-coverage.xml

      - name: Run review-script tests with coverage
        run: |
          coverage run --source=.github/scripts --omit='*test_*.py' -m pytest -q \
            --junitxml=reports/review.junit.xml .github/scripts
          coverage xml -o github-scripts-coverage.xml

      - name: Set up Python for telegram-user-info-bot coverage
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-user-info-bot/requirements.txt

      - name: Run telegram-user-info-bot tests with coverage
        run: |
          python -m pip install -r telegram-user-info-bot/requirements.txt coverage==7.17.1 'pytest>=9.2.0,<10'
          coverage run --source=telegram-user-info-bot -m pytest -q --junitxml=reports/bot.junit.xml telegram-user-info-bot/tests
          coverage xml -o telegram-user-info-bot/coverage.xml

      - name: Run Workspace runtime tests with JavaScript coverage
        id: workspace-tests
        # The managed Workspace adapters are JavaScript; Sonar counts them as
        # product code (see sonar.javascript.lcov.reportPaths). They need the
        # pinned upstream checkout plus its type tooling, and they self-skip
        # without WORKSPACE_UPSTREAM_DIR, so fetch it explicitly here rather
        # than trusting this workflow to see an installed copy.
        env:
          WORKSPACE_REVISION: c631425d8baa933f8c61d8447040f4ec8b5f571c
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/workspace-upstream"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/outsourc-e/hermes-workspace.git "$upstream"
          git -C "$upstream" fetch --quiet --depth 1 origin "$WORKSPACE_REVISION"
          git -C "$upstream" checkout --quiet --detach FETCH_HEAD
          # Verify the checked-out commit matches the pinned revision for supply-chain integrity
          actual_rev=$(git -C "$upstream" rev-parse HEAD)
          if [ "$actual_rev" != "$WORKSPACE_REVISION" ]; then
            echo "::error::Workspace upstream revision mismatch: expected $WORKSPACE_REVISION, got $actual_rev"
            exit 1
          fi
          # The adapter tests transpile upstream TypeScript with the version the
          # pinned checkout expects. `npm install --prefix "$upstream"` would
          # resolve the checkout's whole manifest and pull in hundreds of
          # unpinned transitive packages; install TypeScript alone and link it
          # into the checkout instead.
          ts_install="$RUNNER_TEMP/typescript-only"
          mkdir -p "$ts_install"
          printf '{"name":"typescript-only","private":true}\n' > "$ts_install/package.json"
          npm install --prefix "$ts_install" --no-save --no-audit --no-fund typescript@5
          mkdir -p "$upstream/node_modules"
          ln -s "$ts_install/node_modules/typescript" "$upstream/node_modules/typescript"
          mapfile -t runtime_tests < <(find hermes/runtime -maxdepth 1 -name 'test-*.mjs' | sort)
          WORKSPACE_UPSTREAM_DIR="$upstream" node --test \
            --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/workspace.junit.xml \
            --test-reporter=lcov --test-reporter-destination=hermes-runtime.lcov \
            "${runtime_tests[@]}"

      - name: SonarQube Cloud Scan
        # GitHub does not expose repository secrets to Dependabot PRs, so the
        # Sonar token is unavailable for Dependabot and fork PRs. Keep Sonar
        # strict for pushes and same-repository PRs without false failures.
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.exclusions=**/test_*.py,**/test-*.mjs,**/tests/**/*.py
            -Dsonar.coverage.exclusions=**/test_*.py,**/test-*.mjs,**/tests/**/*.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Save coverage and JUnit reports
        id: save-reports
        if: ${{ !cancelled() && hashFiles('reports/*.junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-reports-${{ github.run_attempt }}
          path: |
            hermes-coverage.xml
            github-scripts-coverage.xml
            telegram-user-info-bot/coverage.xml
            hermes-runtime.lcov
            reports/*.junit.xml
          retention-days: 14
          if-no-files-found: error

  codecov:
    name: Upload coverage to Codecov
    needs: scan
    if: >-
      !cancelled() && needs.scan.outputs.reports_artifact_id != '' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-reports
        with:
          artifact-ids: ${{ needs.scan.outputs.reports_artifact_id }}
          path: codecov-reports
          merge-multiple: true
      - name: Upload coverage
        if: needs.scan.outputs.coverage_ready == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: codecov-reports/hermes-coverage.xml,codecov-reports/github-scripts-coverage.xml,codecov-reports/telegram-user-info-bot/coverage.xml,codecov-reports/hermes-runtime.lcov
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true
      - name: Upload JUnit test results
        if: ${{ !cancelled() && steps.download-reports.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          directory: codecov-reports/reports
          disable_telem: true
