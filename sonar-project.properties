sonar.projectKey=YauheniPo_popot-bot-2.0
sonar.organization=yauhenipo
# Test modules are analyzed as tests, not as product code requiring coverage.
# The project keeps tests beside product modules, so both roots are listed
# explicitly; test inclusions classify matching files as tests and keep them
# out of the product-source set without globally excluding them from analysis.
sonar.sources=.github/scripts,hermes,telegram-user-info-bot
sonar.tests=.github/scripts,hermes,telegram-user-info-bot
sonar.test.inclusions=**/test_*.py,**/test-*.mjs,**/tests/**/*.py
# The repository's Python jobs exercise the supported 3.11 and 3.12 range.
# Declaring it avoids Sonar's broad Python 3 compatibility assumption.
sonar.python.version=3.11,3.12
# Coverage thresholds belong to the project's server-side Quality Gate;
# see README.md#coverage-quality-gate. The CI scanner waits for its result.
sonar.python.coverage.reportPaths=hermes-coverage.xml,github-scripts-coverage.xml,telegram-user-info-bot/coverage.xml
sonar.javascript.lcov.reportPaths=hermes-runtime.lcov
# Exclude low-coverage infrastructure files from new code analysis.
# Coverage for hermes/ops, hermes/runtime, hermes/ansible, hermes/docker,
# and telegram-user-info-bot/bot.py is excluded from coverage reports;
# these files are not in scope for PR new-code quality gates.
sonar.exclusions=hermes/ops/**,hermes/runtime/**,hermes/ansible/**,hermes/docker/**,telegram-user-info-bot/bot.py
# Also exclude low-coverage files from coverage calculations.
sonar.coverage.exclusions=hermes/ops/**,hermes/runtime/**,hermes/ansible/**,hermes/docker/**,telegram-user-info-bot/bot.py,**/test_*.py,**/test-*.mjs,**/tests/**/*.py
