sonar.projectKey=YauheniPo_popot-bot-2.0
sonar.organization=yauhenipo
# Test modules are analyzed as tests, not as product code requiring coverage.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests/**/*.py
sonar.exclusions=**/test_*.py,**/tests/**/*.py
# Coverage thresholds belong to the project's server-side Quality Gate;
# see README.md#coverage-quality-gate. The CI scanner waits for its result.
sonar.python.coverage.reportPaths=hermes-coverage.xml,telegram-user-info-bot/coverage.xml
